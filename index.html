<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Atlas - Enterprise Edition</title>

<!-- ==========================================================================
     1. CSS-STYLING (GPU-OPTIMIERT)
     ========================================================================== -->
<style>
/* --- 1.1 CSS-VARIABLEN & GRUNDGERÜST --- */
:root{
  --bg:#061126;
  --panel:#09162b;
  --line:#5d7090;
  --edge:#a2b0c7;
  --text:#edf2fa;
  --muted:#a7b0c0;
  --yellow:#f0de00;
  --pink:#ff168a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:#061126}
body{
  background:radial-gradient(ellipse at 48% 49%,#14274a 0,rgba(11,29,57,.68) 27%,transparent 54%),linear-gradient(135deg,#050e20,#07152b 65%,#051025);
}
.app{height:100%;display:flex;flex-direction:column}

/* --- 1.2 HEADER & BEDIENLEISTE --- */
header{
  height:68px;display:flex;align-items:center;gap:14px;padding:0 22px;
  background:rgba(3,11,25,.85);
  border-bottom:1px solid #293854;
  z-index:5;
}
.brand{min-width:240px}.brand h1{font-size:17px;line-height:20px;margin:0 0 3px;font-weight:750}.brand p{font-size:11.5px;margin:0;color:#adb6c7}
.controls{display:flex;gap:7px;align-items:center;flex:1;flex-wrap:nowrap}
.search{position:relative}.search span{position:absolute;left:11px;top:8px;font-size:15px;color:#9eabc0}
.search input,select,button{
  height:35px;border:1px solid #293a56;border-radius:6px;background:#09162a;color:#eaf0fb;font:600 12px Inter,Segoe UI,Arial;
}
.search input{width:190px;padding:0 10px 0 32px;outline:none;transition:border-color .2s}
.search input:focus{border-color:#7290bd}
select{width:130px;padding:0 9px;cursor:pointer;outline:none}
select:focus{border-color:#7290bd}
button{
  background:linear-gradient(135deg,#2a477d,#294574);
  border-color:#38598d;padding:0 11px;cursor:pointer;transition:filter .15s, transform .1s;white-space:nowrap;
}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(0.98)}

/* Navigation & IO Buttons */
.history-btn{
  width:35px;height:35px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:bold;
}
.io-btn{display:inline-flex;align-items:center;gap:4px;}

/* --- 1.3 SUBBAR / INFOLEISTE --- */
.subbar{
  height:32px;border-bottom:1px solid #273752;background:rgba(4,13,28,.72);
  display:flex;align-items:center;padding:0 22px;font-size:11.5px;color:#aab4c5;
}
.subbar .help{margin-left:auto}

/* --- 1.4 CANVAS & VIEWPORT --- */
main{position:relative;flex:1;min-height:0}
.viewport{position:absolute;inset:0 264px 0 0;overflow:hidden;cursor:grab}
.viewport.drag{cursor:grabbing}
.viewport.drag *{pointer-events:none !important}
.viewport.selecting{cursor:crosshair}
.scene{
  position:absolute;width:5000px;height:3500px;transform-origin:0 0;
  will-change:transform;
  transform:translate3d(0,0,0);
}

/* Hilfsraster bei Strg */
.scene.grid-active{
  background-image:
    linear-gradient(to right, rgba(106, 167, 237, 0.14) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(106, 167, 237, 0.14) 1px, transparent 1px);
  background-size:25px 25px;
}

/* Auswahlrahmen */
.selection-box{
  position:absolute;border:1px dashed #6aa7ed;background:rgba(106, 167, 237, 0.15);
  pointer-events:none;z-index:10;display:none;will-change:top,left,width,height;
}

/* --- 1.5 VERBINDUNGSLINIEN --- */
.lines{
  position:absolute;inset:0;width:5000px;height:3500px;pointer-events:none;
  will-change:contents;
}
.lines .edge{
  fill:none;stroke:var(--edge);stroke-width:1.6;opacity:0.45;stroke-dasharray:4 4;
}

/* --- 1.6 KACHELN / NODES --- */
.node{
  position:absolute;transform:translate(-50%,-50%);padding:7px 11px;
  border:1px solid #2c466b;border-radius:6px;min-width:44px;
  background:linear-gradient(#122440,#0d1c33);
  box-shadow:0 3px 8px rgba(0,0,0,.25);
  font-size:11px;line-height:14px;white-space:nowrap;text-align:center;color:#eef3fa;
  cursor:grab;user-select:none;transition:transform .12s ease-out, border .12s ease-out;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  will-change:left,top;
}
body.is-dragging .node{transition:none !important}
.node:hover{transform:translate(-50%,-50%) scale(1.05);border-color:#80a2d2}
.node.locked{cursor:pointer}

/* Schloss-, Plus- & Notiz-Icons */
.lock-icon, .add-icon, .note-indicator{
  font-size:10px;line-height:1;cursor:pointer;opacity:0.45;transition:opacity .12s, transform .12s;padding:2px;
}
.add-icon{font-size:13px;font-weight:bold;color:#8ab4f8;padding:0 2px;}
.note-indicator{font-size:11px;opacity:0.9;color:#ffde59;}
.lock-icon:hover, .add-icon:hover, .note-indicator:hover{opacity:1;transform:scale(1.25);color:#fff}
.node.locked .lock-icon{opacity:0.95}

/* Inline Edit Input auf Kacheln */
.node-inline-input{
  background:#09162a;border:1px solid #7290bd;color:#fff;font:inherit;font-size:11px;
  padding:2px 5px;border-radius:4px;outline:none;min-width:60px;text-align:center;
}

/* Zentrums & Gruppen Glows */
.node.group{
  font-size:12px;font-weight:750;border-color:var(--yellow);
  background:linear-gradient(#292b1d,#172333);
  box-shadow:0 0 5px #f0de00,0 0 18px rgba(240,222,0,.45);
  padding:8px 12px;
}
.node.center{
  font-size:17px;font-weight:800;padding:13px 20px;border-color:var(--pink);
  background:linear-gradient(135deg,#4a153f,#281330);
  box-shadow:0 0 5px #ff168a,0 0 28px rgba(255,22,138,.65);
}
.node.theme{border-color:#416b9e;background:linear-gradient(#102542,#0c1b31)}
.node.dim{opacity:.13}
.node.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 24px #6aa7ed}

/* --- 1.7 MINIMAP & ZOOM ANZEIGE --- */
.minimap-container{
  position:absolute;left:14px;bottom:42px;width:160px;height:112px;
  background:rgba(9,22,42,.88);border:1px solid #2a3b58;border-radius:6px;
  overflow:hidden;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:crosshair;
}
#minimapCanvas{width:100%;height:100%;display:block}
.minimap-viewport{
  position:absolute;border:1px solid #6aa7ed;background:rgba(106,167,237,.18);
  pointer-events:none;border-radius:2px;
}
.zoom{
  position:absolute;left:14px;bottom:12px;border:1px solid #2a3b58;background:#09162a;
  border-radius:5px;padding:4px 8px;color:#99a9bf;font-size:10px;z-index:10;
}

/* --- 1.8 SEITENLEISTE & NOTIZEN --- */
aside{
  position:absolute;right:0;top:0;bottom:0;width:264px;
  background:rgba(7,16,32,.95);border-left:1px solid #293954;
  padding:19px 13px;overflow:auto;z-index:4;
}
aside h2{font-size:19px;margin:0 0 7px;word-break:break-word}
aside .subtitle{color:#aeb8ca;font-size:12px;margin-bottom:18px}
.rule{border-top:1px solid #283851;margin:16px 0 18px}
.heading{font-size:12.5px;font-weight:750;margin-bottom:9px}

.note-box{
  width:100%;min-height:90px;max-height:190px;overflow-y:auto;resize:vertical;
  background:#0b1930;border:1px solid #293b58;border-radius:6px;
  color:#edf2fa;padding:8px 10px;font-family:inherit;font-size:12px;line-height:1.5;
  outline:none;box-sizing:border-box;margin-bottom:6px;
}
.note-box:focus{border-color:#7290bd;}
.note-box::-webkit-scrollbar{width:6px;}
.note-box::-webkit-scrollbar-track{background:rgba(0,0,0,0.25);border-radius:3px;}
.note-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px;}

.cards{display:grid;gap:8px}
.card{
  position:relative;border:1px solid #293b58;background:#0b1930;
  border-radius:6px;padding:10px;font-size:12px;cursor:pointer;transition:border-color .15s;
}
.card:hover{border-color:#6784af}
.card strong{display:block;word-break:break-word}
.dot{position:absolute;right:12px;top:10px;width:10px;height:10px;border-radius:50%;}

/* --- 1.9 FORMULARE & BUTTONS --- */
.add-form input{
  width:100%;margin-bottom:8px;background:#0b1930;border:1px solid #293b58;
  color:#fff;padding:7px;border-radius:4px;outline:none;
}
.add-form input:focus{border-color:#7290bd}
.btn-primary{
  width:100%;height:auto;min-height:35px;line-height:1.4;white-space:normal;word-break:break-word;
  background:linear-gradient(135deg,#2a477d,#294574);border:none;color:white;
  padding:8px 10px;border-radius:5px;cursor:pointer;font-weight:bold;
}
.btn-primary:hover{filter:brightness(1.15)}
.btn-danger{background:linear-gradient(135deg,#8a2828,#6b1d1d);}
</style>
</head>

<body>
<!-- ==========================================================================
     2. HTML-STRUKTUR
     ========================================================================== -->
<div class="app">
  <header>
    <div class="brand">
      <h1>IT Atlas</h1>
      <p>Knowledge Graph · Enterprise Edition</p>
    </div>
    <div class="controls">
      <label class="search"><span>⌕</span><input id="search" placeholder="Thema suchen …"></label>
      
      <select id="edgeStyleSelect" title="Verbindungslinien-Stil wählen">
        <option value="curved">Geschwungen</option>
        <option value="straight">Gerade</option>
        <option value="orthogonal">Rechtwinklig</option>
      </select>

      <button id="undoBtn" class="history-btn" title="Schritt zurück (&lt;)">&lt;</button>
      <button id="redoBtn" class="history-btn" title="Schritt vor (&gt;)">&gt;</button>
      <button id="autoLayoutBtn" title="Ungesperrte Kacheln symmetrisch anordnen">⟳ Aufräumen</button>
      <button id="exportBtn" class="io-btn" title="Backup herunterladen">⤓ Export</button>
      <button id="importBtn" class="io-btn" title="Backup laden">⤒ Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button id="reset" title="Kamera zentrieren & Fokus aufheben">Zentrieren</button>
    </div>
  </header>

  <div class="subbar">
    <span>ⓘ &nbsp;Informationstechnik im Zentrum</span>
    <span class="help">Doppelklick: Kachel umbenennen · Strg+C/V: Kopieren/Einfügen · Strg: Raster · Shift: Box-Auswahl · Taste 'E': Zentrieren</span>
  </div>

  <main>
    <div class="viewport" id="viewport">
      <div id="selectionBox" class="selection-box"></div>
      <div class="scene" id="scene">
        <svg class="lines" id="lines" viewBox="0 0 5000 3500"></svg>
        <div id="nodes"></div>
      </div>
      
      <div class="minimap-container" id="minimapContainer" title="Klicken/Ziehen zum Navigieren">
        <canvas id="minimapCanvas" width="160" height="112"></canvas>
        <div class="minimap-viewport" id="minimapViewport"></div>
      </div>

      <div class="zoom" id="zoom">65%</div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

<!-- ==========================================================================
     3. JAVASCRIPT-LOGIK
     ========================================================================== -->
<script>
// ==========================================================================
// BLOCK A: ZENTRALE KONFIGURATION & INITIALDATEN
// ==========================================================================
const CANVAS_W = 5000;
const CANVAS_H = 3500;
const C = { id: 'root', name: 'Informationstechnik', x: 2500, y: 1750 };
const GRID_SIZE = 25;

let edgeStyle = localStorage.getItem('atlas_edge_style') || 'curved';
document.getElementById('edgeStyleSelect').value = edgeStyle;

function generateId() {
  return 'n_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const defaultGroups = [
  { id: 'g_infra', name: 'Infrastruktur', x: 2000, y: 1375, children: [ { id: 't_id', name: 'Identität & Zugriff', children: [] } ] },
  { id: 'g_net', name: 'Netzwerke', x: 2860, y: 1375, children: [ { id: 't_netconn', name: 'Netzwerkverbindung', children: [] }, { id: 't_vpn', name: 'VPN', children: [] }, { id: 't_proxy', name: 'Proxy & Internet', children: [] }, { id: 't_net', name: 'Netzwerk', children: [] } ] },
  { id: 'g_sys', name: 'Systeme', x: 3000, y: 1750, children: [ { id: 't_os', name: 'Betriebssysteme', children: [] }, { id: 't_endpoint', name: 'Endpoint & Client Management', children: [] }, { id: 't_hw', name: 'Hardware', children: [] }, { id: 't_mobile', name: 'Mobile Geräte', children: [] } ] },
  { id: 'g_soft', name: 'Software', x: 2000, y: 2125, children: [ { id: 't_dev', name: 'Softwareentwicklung', children: [] }, { id: 't_db', name: 'Daten & Datenbank', children: [] }, { id: 't_web', name: 'Web & Internet', children: [] }, { id: 't_cloud', name: 'Cloud & Visualisierung', children: [] } ] },
  { id: 'g_sec', name: 'Sicherheit', x: 2500, y: 2200, children: [ { id: 't_sec', name: 'IT-Sicherheit', children: [] } ] },
  { id: 'g_itsm', name: 'Service Management', x: 2000, y: 1750, children: [ { id: 't_itsm', name: 'ITSM & Prozesse', children: [] } ] },
  { id: 'g_ki', name: 'Künstliche Intelligenz', x: 2500, y: 1300, children: [ { id: 't_ki', name: 'KI & Machine Learning', children: [] } ] }
];

function normalizeTree(item, isGroup = false) {
  if (!item) return null;
  let id, name, x = 2500, y = 1750, children = [];

  if (typeof item === 'string') {
    name = item;
    id = generateId();
  } else if (Array.isArray(item)) {
    if (isGroup || item.length >= 4) {
      name = String(item[0] || 'Gruppe');
      x = Number(item[1]) || 2500;
      y = Number(item[2]) || 1750;
      let rawChildren = Array.isArray(item[3]) ? item[3] : [];
      children = rawChildren.map(c => normalizeTree(c, false)).filter(Boolean);
      id = item.id || generateId();
    } else {
      name = String(item[0] || 'Begriff');
      let rawChildren = Array.isArray(item[1]) ? item[1] : [];
      children = rawChildren.map(c => normalizeTree(c, false)).filter(Boolean);
      id = item.id || generateId();
    }
  } else if (typeof item === 'object') {
    id = item.id || generateId();
    name = String(item.name || 'Begriff');
    x = item.x !== undefined ? Number(item.x) : 2500;
    y = item.y !== undefined ? Number(item.y) : 1750;
    let rawChildren = Array.isArray(item.children) ? item.children : [];
    children = rawChildren.map(c => normalizeTree(c, false)).filter(Boolean);
  }

  return { id, name, x, y, children };
}

function migrateOldData(groups, pos = {}, locked = {}, notes = {}) {
  const nameToId = {};
  function traverse(list) {
    if (!list || !Array.isArray(list)) return;
    list.forEach(item => {
      if (!item) return;
      if (!nameToId[item.name]) nameToId[item.name] = item.id;
      if (item.children && Array.isArray(item.children)) traverse(item.children);
    });
  }
  traverse(groups);

  const newPos = {}, newLocked = {}, newNotes = {};
  for (let k in pos) {
    const targetId = nameToId[k] || k;
    newPos[targetId] = pos[k];
  }
  for (let k in locked) {
    const targetId = nameToId[k] || k;
    newLocked[targetId] = locked[k];
  }
  for (let k in notes) {
    const targetId = nameToId[k] || k;
    newNotes[targetId] = notes[k];
  }
  return { pos: newPos, locked: newLocked, notes: newNotes };
}

// ==========================================================================
// BLOCK B: STATE MANAGEMENT & HISTORY
// ==========================================================================
let rawGroups = JSON.parse(localStorage.getItem('atlas_groups')) || defaultGroups;
let rawPos = JSON.parse(localStorage.getItem('atlas_pos')) || {};
let rawLocked = JSON.parse(localStorage.getItem('atlas_locked')) || {};
let rawNotes = JSON.parse(localStorage.getItem('atlas_notes')) || {};

let activeGroups = rawGroups.map(g => normalizeTree(g, true)).filter(Boolean);
let migrated = migrateOldData(activeGroups, rawPos, rawLocked, rawNotes);
let activePos = migrated.pos;
let lockedNodes = migrated.locked;
let activeNotes = migrated.notes;

let selectedNodes = new Set(); 
let historyStack = [];
let redoStack = [];
let clipboardNodes = []; // Mehrfach-Kopieren

function saveData(recordHistory = true) {
  if (recordHistory) {
    historyStack.push({
      groups: JSON.parse(JSON.stringify(activeGroups)),
      pos: JSON.parse(JSON.stringify(activePos)),
      locked: JSON.parse(JSON.stringify(lockedNodes)),
      notes: JSON.parse(JSON.stringify(activeNotes))
    });
    if (historyStack.length > 30) historyStack.shift(); 
    redoStack = [];
  }

  localStorage.setItem('atlas_groups', JSON.stringify(activeGroups));
  localStorage.setItem('atlas_pos', JSON.stringify(activePos));
  localStorage.setItem('atlas_locked', JSON.stringify(lockedNodes));
  localStorage.setItem('atlas_notes', JSON.stringify(activeNotes));
}

// UNDO / REDO
document.getElementById('undoBtn').onclick = () => {
  flushCurrentNotes();
  if (historyStack.length > 0) {
    redoStack.push({
      groups: JSON.parse(JSON.stringify(activeGroups)),
      pos: JSON.parse(JSON.stringify(activePos)),
      locked: JSON.parse(JSON.stringify(lockedNodes)),
      notes: JSON.parse(JSON.stringify(activeNotes))
    });
    let lastState = historyStack.pop();
    activeGroups = lastState.groups;
    activePos = lastState.pos;
    lockedNodes = lastState.locked || {};
    activeNotes = lastState.notes || {};
    saveData(false);
    buildGraph();
    reset(false); 
  } else {
    alert("Keine weiteren Schritte zum Zurückgehen vorhanden.");
  }
};

document.getElementById('redoBtn').onclick = () => {
  flushCurrentNotes();
  if (redoStack.length > 0) {
    historyStack.push({
      groups: JSON.parse(JSON.stringify(activeGroups)),
      pos: JSON.parse(JSON.stringify(activePos)),
      locked: JSON.parse(JSON.stringify(lockedNodes)),
      notes: JSON.parse(JSON.stringify(activeNotes))
    });
    let nextState = redoStack.pop();
    activeGroups = nextState.groups;
    activePos = nextState.pos;
    lockedNodes = nextState.locked || {};
    activeNotes = nextState.notes || {};
    saveData(false);
    buildGraph();
    reset(false);
  } else {
    alert("Keine weiteren Schritte zum Vorwärtsgehen vorhanden.");
  }
};

// EXPORT / IMPORT
document.getElementById('exportBtn').onclick = () => {
  flushCurrentNotes();
  const exportPayload = {
    groups: activeGroups,
    pos: activePos,
    locked: lockedNodes,
    notes: activeNotes,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'it-atlas-backup.json';
  a.click();
  URL.revokeObjectURL(url);
};

const importInput = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importInput.click();

importInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const data = JSON.parse(event.target.result);
      if (data && data.groups) {
        saveData(true);
        const importedGroups = (data.groups || defaultGroups).map(g => normalizeTree(g, true)).filter(Boolean);
        const migratedImport = migrateOldData(importedGroups, data.pos || {}, data.locked || {}, data.notes || {});
        
        activeGroups = importedGroups;
        activePos = migratedImport.pos;
        lockedNodes = migratedImport.locked;
        activeNotes = migratedImport.notes;

        saveData(false);
        buildGraph();
        reset(true);
        alert('Atlas-Daten wurden erfolgreich importiert!');
      } else {
        alert('Ungültiges Dateiformat.');
      }
    } catch (err) {
      alert('Fehler beim Lesen der Datei: ' + err.message);
    }
  };
  reader.readAsText(file);
  importInput.value = '';
};

// FIX: Auto-Layout behält gesperrte Kacheln bei
document.getElementById('autoLayoutBtn').onclick = () => {
  if (confirm("Möchtest du alle ungesperrten Kachel-Positionen zurücksetzen und das Layout symmetrisch aufräumen?")) {
    flushCurrentNotes();
    saveData(true);
    const preservedPos = {};
    for (let id in lockedNodes) {
      if (lockedNodes[id] && activePos[id]) {
        preservedPos[id] = activePos[id];
      }
    }
    activePos = preservedPos;
    saveData(false);
    buildGraph();
    centerCamera();
  }
};

// Linienstil Auswahl
document.getElementById('edgeStyleSelect').onchange = (e) => {
  edgeStyle = e.target.value;
  localStorage.setItem('atlas_edge_style', edgeStyle);
  updateEdges();
};

// ==========================================================================
// BLOCK C: GLOBALE STRUKTUR- & CACHE-REFERENZEN
// ==========================================================================
let nodeMap = {}, parent = {}, children = {}, kindMap = {}, levelMap = {};
let edgeList = [];
const el = document.getElementById('nodes');
const lines = document.getElementById('lines');

// ==========================================================================
// BLOCK D: RENDERING & INLINE-EDITING
// ==========================================================================
function node(id, name, x, y, kind = 'term', level = 4) {
  const d = document.createElement('div');
  d.className = 'node ' + kind;
  d.dataset.id = id;
  
  const isLocked = !!lockedNodes[id];
  if (isLocked) d.classList.add('locked');

  if (activePos[id]) { x = activePos[id].x; y = activePos[id].y; }
  
  d.style.left = x + 'px'; 
  d.style.top = y + 'px';

  // Schloss-Icon
  const lock = document.createElement('span');
  lock.className = 'lock-icon';
  lock.textContent = isLocked ? '🔒' : '🔓';
  lock.title = isLocked ? 'Position gesperrt (Klicken zum Entsperren)' : 'Position frei (Klicken zum Sperren)';

  lock.onmousedown = e => e.stopPropagation();
  lock.onclick = e => {
    e.stopPropagation();
    saveData(true);
    lockedNodes[id] = !lockedNodes[id];
    saveData(false);
    lock.textContent = lockedNodes[id] ? '🔒' : '🔓';
    lock.title = lockedNodes[id] ? 'Position gesperrt (Klicken zum Entsperren)' : 'Position frei (Klicken zum Sperren)';
    d.classList.toggle('locked', lockedNodes[id]);
  };

  // Notiz-Indikator
  const hasNote = activeNotes[id] && activeNotes[id].trim().length > 0;
  const noteIndicator = document.createElement('span');
  noteIndicator.className = 'note-indicator';
  noteIndicator.textContent = '📝';
  noteIndicator.title = 'Notiz vorhanden (Klicken zum Öffnen)';
  noteIndicator.style.display = hasNote ? 'inline-block' : 'none';
  noteIndicator.onmousedown = e => e.stopPropagation();
  noteIndicator.onclick = e => {
    e.stopPropagation();
    focus(id);
    const nBox = document.getElementById('nodeNotes');
    if (nBox) nBox.focus();
  };

  // Label
  const label = document.createElement('span');
  label.className = 'node-label';
  label.textContent = name;

  // Inline-Editing per Doppelklick
  d.ondblclick = (e) => {
    e.stopPropagation();
    if (id === C.id) return;

    const currentName = nodeMap[id].name;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'node-inline-input';
    input.value = currentName;

    label.style.display = 'none';
    d.insertBefore(input, label);
    input.focus();
    input.select();

    const saveInline = () => {
      const newName = input.value.trim();
      if (newName && newName !== currentName) {
        renameNodeInData(id, newName);
      } else {
        input.remove();
        label.style.display = 'inline';
      }
    };

    input.onkeydown = (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); saveInline(); }
      if (ev.key === 'Escape') { input.remove(); label.style.display = 'inline'; }
    };
    input.onblur = saveInline;
    input.onmousedown = (ev) => ev.stopPropagation();
  };

  d.append(lock);

  // Plus-Icon
  const addBtn = document.createElement('span');
  addBtn.className = 'add-icon';
  addBtn.textContent = '+';
  addBtn.title = `Unterbegriff zu '${name}' hinzufügen`;
  addBtn.onmousedown = e => e.stopPropagation();
  addBtn.onclick = e => {
    e.stopPropagation();
    focus(id);
    const btnShow = document.getElementById('showAddFormBtn');
    if (btnShow) {
      btnShow.click();
      const inputField = document.getElementById('newNodeName');
      if (inputField) inputField.focus();
    }
  };
  d.append(addBtn);
  d.append(noteIndicator);
  d.append(label);
  
  // Dragging
  d.onmousedown = e => {
    e.stopPropagation();
    let startX = e.clientX, startY = e.clientY;
    let moved = false;

    let dragTargets = [];
    if (selectedNodes.has(id) && selectedNodes.size > 1) {
      selectedNodes.forEach(tId => {
        if (!lockedNodes[tId] && nodeMap[tId]) {
          dragTargets.push({ id: tId, startX: nodeMap[tId].x, startY: nodeMap[tId].y, w: nodeMap[tId].w });
        }
      });
    } else {
      if (!lockedNodes[id] && nodeMap[id]) {
        dragTargets.push({ id: id, startX: nodeMap[id].x, startY: nodeMap[id].y, w: nodeMap[id].w });
      }
    }

    let rafId = null;
    let curClientX = startX, curClientY = startY, curCtrl = e.ctrlKey;

    const updateDragPositions = () => {
      let dx = (curClientX - startX) / scale;
      let dy = (curClientY - startY) / scale;

      for (let i = 0; i < dragTargets.length; i++) {
        let target = dragTargets[i];
        let nObj = nodeMap[target.id];
        if (!nObj) continue;

        let newX = target.startX + dx;
        let newY = target.startY + dy;

        if (curCtrl) {
          let leftEdge = newX - target.w / 2;
          let snappedLeft = Math.round(leftEdge / GRID_SIZE) * GRID_SIZE;
          newX = snappedLeft + target.w / 2;
          newY = Math.round(newY / GRID_SIZE) * GRID_SIZE;
        }

        nObj.x = newX;
        nObj.y = newY;
        nObj.el.style.left = newX + 'px';
        nObj.el.style.top = newY + 'px';
      }
      updateEdges();
      rafId = null;
    };

    const onMouseMove = ev => {
      let dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      if (dist > 3) {
        if (!moved) {
          document.body.classList.add('is-dragging');
          d.style.cursor = 'grabbing';
          moved = true;
        }
      }
      if (!moved || dragTargets.length === 0) return;

      curClientX = ev.clientX;
      curClientY = ev.clientY;
      curCtrl = ev.ctrlKey;

      if (!rafId) {
        rafId = requestAnimationFrame(updateDragPositions);
      }
    };

    const onMouseUp = () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
      document.body.classList.remove('is-dragging');
      if (rafId) cancelAnimationFrame(rafId);

      d.style.cursor = lockedNodes[id] ? 'pointer' : 'grab';
      
      if (moved) {
        saveData(true); 
        dragTargets.forEach(target => {
          if (nodeMap[target.id]) {
            activePos[target.id] = { x: nodeMap[target.id].x, y: nodeMap[target.id].y };
          }
        });
        saveData(false);
        renderMinimap();
      } else {
        if (e.shiftKey) {
          if (selectedNodes.has(id)) {
            selectedNodes.delete(id);
            d.classList.remove('sel');
          } else {
            selectedNodes.add(id);
            d.classList.add('sel');
          }
          if (selectedNodes.size > 1) {
            renderMultiSelectPanel();
          } else if (selectedNodes.size === 1) {
            focus(Array.from(selectedNodes)[0]);
          } else {
            reset(false);
          }
        } else {
          if (d.classList.contains('sel') && selectedNodes.size === 1 && selectedNodes.has(id)) {
            reset(false);
          } else {
            focus(id);
          }
        }
      }
    };
    window.addEventListener('mousemove', onMouseMove, { passive: true });
    window.addEventListener('mouseup', onMouseUp);
  };

  el.append(d); 
  
  const cachedW = d.offsetWidth || (name.length * 7 + 45);
  const cachedH = d.offsetHeight || 30;

  nodeMap[id] = { el: d, x, y, w: cachedW, h: cachedH, kind, name, id };
  kindMap[id] = kind;
  levelMap[id] = level;
}

// ==========================================================================
// BLOCK E: SVG-KANTEN & VERBINDUNGSLINIEN
// ==========================================================================
function edge(aId, bId, center = false) {
  const A = nodeMap[aId], B = nodeMap[bId];
  if (!A || !B) return;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.classList.add('edge');
  if (center) path.classList.add('center-line');
  lines.append(path);
  
  const edgeObj = { path, aId, bId };
  edgeList.push(edgeObj);
  updateEdgePath(path, A, B);
}

// FIX: Saubere rechtwinklige Linienführung
function updateEdgePath(path, A, B) {
  const ax = A.x, ay = A.y, bx = B.x, by = B.y;

  if (edgeStyle === 'straight') {
    path.setAttribute('d', `M ${ax} ${ay} L ${bx} ${by}`);
  } else if (edgeStyle === 'orthogonal') {
    const dx = Math.abs(bx - ax);
    const dy = Math.abs(by - ay);
    if (dx >= dy) {
      const mx = (ax + bx) / 2;
      path.setAttribute('d', `M ${ax} ${ay} L ${mx} ${ay} L ${mx} ${by} L ${bx} ${by}`);
    } else {
      const my = (ay + by) / 2;
      path.setAttribute('d', `M ${ax} ${ay} L ${ax} ${my} L ${bx} ${my} L ${bx} ${by}`);
    }
  } else {
    // Standard: Geschwungen (Curved)
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const bend = Math.min(75, len * RADIAL.curveStrength);
    const mx = (ax + bx) / 2 + nx * bend;
    const my = (ay + by) / 2 + ny * bend;
    path.setAttribute('d', `M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}`);
  }
}

function updateEdges() {
  for (let i = 0; i < edgeList.length; i++) {
    const e = edgeList[i];
    const A = nodeMap[e.aId], B = nodeMap[e.bId];
    if (A && B) updateEdgePath(e.path, A, B);
  }
}

// ==========================================================================
// BLOCK F: GEOMETRIE- & LAYOUT-BERECHNUNGEN (RADIAL)
// ==========================================================================
const RADIAL = {
  centerX: C.x, centerY: C.y, groupRadius: 380, outerRadius: 620, sectorGap: 18, minNodeGap: 10, curveStrength: 0.18
};

function polarPoint(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
}

function nodeHalfWidth(name) {
  const estW = name.length * 7 + 45;
  return { w: estW / 2, h: 16 };
}

function placeOnOuterCircle(names, sectorCenter, sectorWidth) {
  if (!names.length) return [];
  const sizes = names.map(n => nodeHalfWidth(n));
  const radius = RADIAL.outerRadius;
  const usable = Math.max(20, sectorWidth - RADIAL.sectorGap * 2);
  let required = 0;
  for (let i = 0; i < sizes.length - 1; i++) {
    const a = sizes[i], b = sizes[i + 1];
    required += Math.max(a.w + b.w + RADIAL.minNodeGap, a.h + b.h + RADIAL.minNodeGap) / radius * 180 / Math.PI;
  }
  const step = Math.max(4, Math.min(usable / Math.max(1, names.length - 1), required / Math.max(1, names.length - 1)));
  const total = step * (names.length - 1);
  const start = sectorCenter - total / 2;
  return names.map((name, i) => polarPoint(RADIAL.centerX, RADIAL.centerY, radius, start + i * step));
}

// ==========================================================================
// BLOCK G: GRAPH-INITIALISIERUNG & REKURSIVER BAUMAUFBAU
// ==========================================================================
function buildSubtree(parentId, parentX, parentY, childrenList, level) {
  if (!childrenList || !Array.isArray(childrenList) || !childrenList.length) return;

  const dx = parentX - C.x;
  const dy = parentY - C.y;
  const outwardAngle = (Math.hypot(dx, dy) > 10) ? Math.atan2(dy, dx) * 180 / Math.PI : 0;
  
  const count = childrenList.length;
  const localDist = Math.max(90, Math.min(145, 70 + count * 8));
  const tangent = outwardAngle + 90;
  const spread = Math.min(80, Math.max(20, (count - 1) * 14));

  childrenList.forEach((childItem, i) => {
    if (!childItem) return;
    const a = (count === 1) ? outwardAngle : (tangent + (i - (count - 1) / 2) * (spread / Math.max(1, count - 1)));
    const [sx, sy] = polarPoint(parentX, parentY, localDist, a);

    const kind = 'term';
    node(childItem.id, childItem.name, sx, sy, kind, level);
    parent[childItem.id] = parentId;
    children[parentId] ??= [];
    children[parentId].push(childItem.id);
    edge(parentId, childItem.id);

    const actualX = (activePos[childItem.id] ? activePos[childItem.id].x : sx);
    const actualY = (activePos[childItem.id] ? activePos[childItem.id].y : sy);

    if (childItem.children && childItem.children.length > 0) {
      buildSubtree(childItem.id, actualX, actualY, childItem.children, level + 1);
    }
  });
}

function buildGraph() {
  el.innerHTML = ''; 
  lines.innerHTML = '';
  edgeList = [];
  selectedNodes.clear();
  for (let k in nodeMap) delete nodeMap[k];
  for (let k in parent) delete parent[k];
  for (let k in children) delete children[k];
  for (let k in kindMap) delete kindMap[k];
  for (let k in levelMap) delete levelMap[k];

  node(C.id, C.name, C.x, C.y, 'center', 1);

  const groupAngles = Array.from({ length: activeGroups.length }, (_, i) => -90 + i * (360 / Math.max(1, activeGroups.length)));

  activeGroups.forEach((g, gi) => {
    const ga = groupAngles[gi];
    const [gx, gy] = polarPoint(RADIAL.centerX, RADIAL.centerY, RADIAL.groupRadius, ga);

    node(g.id, g.name, gx, gy, 'group', 2);
    parent[g.id] = C.id;
    children[C.id] ??= []; 
    children[C.id].push(g.id);
    edge(C.id, g.id, true);

    const sectorCenter = ga;
    const sectorWidth = 72;
    const directNames = (g.children || []).map(t => t.name);
    const directPts = placeOnOuterCircle(directNames, sectorCenter, sectorWidth);

    (g.children || []).forEach((theme, ti) => {
      const [tx, ty] = directPts[ti] || [gx + 60, gy + 60];

      node(theme.id, theme.name, tx, ty, 'theme', 3);
      parent[theme.id] = g.id;
      children[g.id] ??= []; 
      children[g.id].push(theme.id);
      edge(g.id, theme.id);

      const actualThemeX = activePos[theme.id] ? activePos[theme.id].x : tx;
      const actualThemeY = activePos[theme.id] ? activePos[theme.id].y : ty;

      if (theme.children && theme.children.length > 0) {
        buildSubtree(theme.id, actualThemeX, actualThemeY, theme.children, 4);
      }
    });
  });

  requestAnimationFrame(() => {
    solveCollisions();
    renderMinimap();
  });
}

function solveCollisions() {
  const terms = Object.values(nodeMap).filter(n => n.kind === 'term');
  const fixed = Object.values(nodeMap).filter(n => n.kind !== 'term');
  function rect(n, x, y) {
    const w = n.w, h = n.h;
    return { left: x - w / 2, right: x + w / 2, top: y - h / 2, bottom: y + h / 2, w, h };
  }
  function clear(a, b, gap) {
    return a.right + gap <= b.left || a.left - gap >= b.right || a.bottom + gap <= b.top || a.top - gap >= b.bottom;
  }
  function collides(n, x, y, placed, gap) {
    const r = rect(n, x, y);
    for (let i = 0; i < fixed.length; i++) { if (fixed[i] !== n && !clear(r, rect(fixed[i], fixed[i].x, fixed[i].y), gap)) return true; }
    for (let i = 0; i < placed.length; i++) { if (placed[i] !== n && !clear(r, rect(placed[i], placed[i].x, placed[i].y), gap)) return true; }
    return false;
  }

  const gap = 6, maxRadius = 450, placed = [];

  terms.forEach(n => {
    const nodeId = n.id;
    if (activePos[nodeId]) { placed.push(n); return; }

    const pId = parent[nodeId];
    const parentNode = nodeMap[pId];
    if (!parentNode) return;

    const gpId = parent[pId];
    const grandParentNode = gpId ? nodeMap[gpId] : null;

    let dx = parentNode.x - (grandParentNode ? grandParentNode.x : C.x);
    let dy = parentNode.y - (grandParentNode ? grandParentNode.y : C.y);
    let len = Math.hypot(dx, dy) || 1;
    let ux = dx / len, uy = dy / len, vx = -uy, vy = ux;
    let found = null;

    for (let r = 48; r <= maxRadius && !found; r += 8) {
      const count = Math.max(8, Math.ceil(2 * Math.PI * r / 24));
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        const x = parentNode.x + ux * r * Math.cos(a) + vx * r * Math.sin(a);
        const y = parentNode.y + uy * r * Math.cos(a) + vy * r * Math.sin(a);
        if (x < 80 || x > CANVAS_W - 80 || y < 60 || y > CANVAS_H - 60) continue;
        if (!collides(n, x, y, placed, gap)) { found = { x, y }; break; }
      }
    }
    if (found) { 
      n.x = found.x; n.y = found.y; 
      n.el.style.left = n.x + 'px';
      n.el.style.top = n.y + 'px';
      placed.push(n); 
    }
  });

  updateEdges();
}

function directGroups() { return activeGroups.map(g => g.id); }
function directChildren(id) { return children[id] || []; }

function card(id) {
  const nObj = nodeMap[id];
  const name = nObj ? nObj.name : id;
  const safeName = escapeHtml(name);
  return `<div class="card" data-id="${id}"><i class="dot" style="background:#6aa7ed"></i><strong>${safeName}</strong></div>`;
}

function getLevelDescription(id) {
  const lvl = levelMap[id] || 1;
  if (lvl === 1) return 'Zentrum der Informationstechnik (Level 1)';
  if (lvl === 2) return 'Hauptbereich (Level 2)';
  if (lvl === 3) return 'Thema (Level 3)';
  return `Unterbegriff (Level ${lvl})`;
}

function flushCurrentNotes() {
  const currentNotesEl = document.getElementById('nodeNotes');
  if (currentNotesEl && currentNotesEl.dataset.nodeId) {
    const currentId = currentNotesEl.dataset.nodeId;
    if (activeNotes[currentId] !== currentNotesEl.value) {
      activeNotes[currentId] = currentNotesEl.value;
      saveData(true);
    }
  }
}

            if (lockSpan) lockSpan.textContent = '🔓';
          }
        }

        const ind = nodeMap[id].el.querySelector('.note-indicator');
        if (ind) ind.style.display = e.target.value.trim().length > 0 ? 'inline-block' : 'none';

      if (nName) addNodeToData(id, nName);

      btnShow.style.display = 'none';
      document.getElementById('addFormArea').style.display = 'flex';
      inputNodeName.focus();

      if (newName && newName !== name) renameNodeInData(id, newName);
    };

    btnRename.onclick = () => {
      btnRename.style.display = 'none';
      document.getElementById('renameFormArea').style.display = 'flex';
      renameInput.focus();

  if (btnDel) {

      if (confirm(`Möchtest du '${name}' und alle dazugehörigen Unterbegriffe wirklich löschen?`)) {
        deleteNodeFromData(id);
      }
    };
  }
}

// ==========================================================================
// BLOCK I: REKURSIVE DATEN-MANIPULATION
// ==========================================================================
function findNodeInTree(targetId) {
  for (let i = 0; i < activeGroups.length; i++) {
    let g = activeGroups[i];
    if (g.id === targetId) return { node: g, isGroup: true, parentArray: activeGroups, index: i };
    const found = searchChildren(g.children, g, targetId);
    if (found) return found;
  }
  return null;
}

function searchChildren(list, parentNode, targetId) {
  if (!list || !Array.isArray(list)) return null;
  for (let i = 0; i < list.length; i++) {
    let item = list[i];
    if (!item) continue;
    if (item.id === targetId) return { node: item, isGroup: false, parentNode: parentNode, parentArray: list, index: i };
    if (item.children && item.children.length > 0) {
      const found = searchChildren(item.children, item, targetId);
      if (found) return found;
    }
  }
  return null;
}

function addNodeToData(parentId, newName) {
  flushCurrentNotes();
  saveData(true); 
  const newId = generateId();
  let spawnX = C.x, spawnY = C.y;

  if (parentId === C.id) {
    const angle = Math.random() * Math.PI * 2;
    spawnX = Math.round(C.x + Math.cos(angle) * (RADIAL.groupRadius * 0.85));
    spawnY = Math.round(C.y + Math.sin(angle) * (RADIAL.groupRadius * 0.85));
    activeGroups.push({ id: newId, name: newName, x: spawnX, y: spawnY, children: [] });
    activePos[newId] = { x: spawnX, y: spawnY };
  } else {
    const target = findNodeInTree(parentId);
    if (target) {
      const pNode = nodeMap[parentId] || { x: C.x, y: C.y };
      const dx = pNode.x - C.x;
      const dy = pNode.y - C.y;
      
      const offsetDist = 115;
      const jitterAngle = (Math.random() - 0.5) * 0.8;
      const angle = (Math.hypot(dx, dy) > 10 ? Math.atan2(dy, dx) : (Math.random() * Math.PI * 2)) + jitterAngle;
      
      spawnX = Math.round(pNode.x + Math.cos(angle) * offsetDist);
      spawnY = Math.round(pNode.y + Math.sin(angle) * offsetDist);

      spawnX = Math.max(80, Math.min(CANVAS_W - 80, spawnX));
      spawnY = Math.max(60, Math.min(CANVAS_H - 60, spawnY));

      if (!Array.isArray(target.node.children)) target.node.children = [];
      target.node.children.push({ id: newId, name: newName, children: [] });
      activePos[newId] = { x: spawnX, y: spawnY };
    }
  }

  saveData(false);
  buildGraph();
  focus(newId);
}

// FIX: Flackerfreies Umbenennen
function renameNodeInData(id, newName) {
  if (id === C.id) return;
  flushCurrentNotes();
  saveData(true);
  const target = findNodeInTree(id);
  if (target) {
    target.node.name = newName;
  }
  
  if (nodeMap[id]) {
    nodeMap[id].name = newName;
    const label = nodeMap[id].el.querySelector('.node-label');
    if (label) {
      label.textContent = newName;
      label.style.display = 'inline';
    }
    const inlineInput = nodeMap[id].el.querySelector('.node-inline-input');
    if (inlineInput) inlineInput.remove();

    nodeMap[id].w = nodeMap[id].el.offsetWidth || (newName.length * 7 + 45);
    nodeMap[id].h = nodeMap[id].el.offsetHeight || 30;
  }

  saveData(false);
  panel(id);
  renderMinimap();
}

function collectAllDescendantIds(nodeItem) {
  if (!nodeItem) return [];
  let ids = [nodeItem.id];
  if (Array.isArray(nodeItem.children)) {
    nodeItem.children.forEach(child => {
      ids = ids.concat(collectAllDescendantIds(child));
    });
  }
  return ids;
}

function deleteNodeFromData(id) {
  if (id === C.id) return;
  flushCurrentNotes();
  saveData(true); 

  const target = findNodeInTree(id);
  if (target) {
    const allIds = collectAllDescendantIds(target.node);
    target.parentArray.splice(target.index, 1);
    allIds.forEach(nodeId => {
      delete activePos[nodeId];
      delete lockedNodes[nodeId];
      delete activeNotes[nodeId];
    });
  }

  saveData(false);
  buildGraph();
  reset(false);
}

function deleteMultipleNodes(idList) {
  const validIds = new Set(idList.filter(id => id !== C.id));
  if (validIds.size === 0) return;

  if (!confirm(`Möchtest du wirklich alle ${validIds.size} ausgewählten Begriffe (inklusive deren Unterbegriffe) löschen?`)) {
    return;
  }

  flushCurrentNotes();
  saveData(true);
  const allIdsToDelete = new Set();

  function filterTree(list) {
    if (!list || !Array.isArray(list)) return [];
    const result = [];
    for (let item of list) {
      if (validIds.has(item.id)) {
        collectAllDescendantIds(item).forEach(childId => allIdsToDelete.add(childId));
      } else {
        if (item.children && Array.isArray(item.children)) {
          item.children = filterTree(item.children);
        }
        result.push(item);
      }
    }
    return result;
  }

  activeGroups = filterTree(activeGroups);

  allIdsToDelete.forEach(nodeId => {
    delete activePos[nodeId];
    delete lockedNodes[nodeId];
    delete activeNotes[nodeId];
  });

  saveData(false);
  selectedNodes.clear();
  buildGraph();
  reset(false);
}

// FIX: Multi-Kopieren & Einfügen
function cloneSubtreeWithNewIds(nodeObj) {
  const newId = generateId();
  if (activeNotes[nodeObj.id]) activeNotes[newId] = activeNotes[nodeObj.id];
  return {
    id: newId,
    name: nodeObj.name + ' (Kopie)',
    children: (nodeObj.children || []).map(child => cloneSubtreeWithNewIds(child))
  };
}

function copySelectedNodes() {
  if (selectedNodes.size === 0) return;
  clipboardNodes = [];
  selectedNodes.forEach(selId => {
    if (selId === C.id) return;
    const target = findNodeInTree(selId);
    if (target) {
      clipboardNodes.push(JSON.parse(JSON.stringify(target.node)));
    }
  });
}

function pasteNodes() {
  if (!clipboardNodes || clipboardNodes.length === 0) return;
  flushCurrentNotes();
  saveData(true);

  const targetParentId = selectedNodes.size === 1 ? Array.from(selectedNodes)[0] : C.id;
  let lastPastedId = null;

  clipboardNodes.forEach(nodeData => {
    const cloned = cloneSubtreeWithNewIds(nodeData);
    lastPastedId = cloned.id;

    if (targetParentId === C.id) {
      activeGroups.push(cloned);
    } else {
      const dest = findNodeInTree(targetParentId);
      if (dest) {
        if (!Array.isArray(dest.node.children)) dest.node.children = [];
        dest.node.children.push(cloned);
      }
    }
  });

  saveData(false);
  buildGraph();
  if (lastPastedId) focus(lastPastedId);
}

// ==========================================================================
// BLOCK J: INTERAKTIONS-LOGIK
// ==========================================================================
function focus(id) {
  if (!id || !nodeMap[id]) return;
  document.getElementById('search').value = '';
  selectedNodes.clear();
  selectedNodes.add(id);
  Object.values(nodeMap).forEach(n => n.el.classList.remove('sel', 'dim'));

  const keep = new Set([id]);
  if (id === C.id) { 
    directGroups().forEach(x => keep.add(x));
  } else {
    let curr = id;
    const visited = new Set([curr]);
    while (curr && parent[curr] && !visited.has(parent[curr])) {
      visited.add(parent[curr]);
      keep.add(parent[curr]);
      curr = parent[curr];
    }
    directChildren(id).forEach(x => keep.add(x));
  }

  Object.entries(nodeMap).forEach(([kId, n]) => {
    if (!keep.has(kId)) n.el.classList.add('dim');
  });
  
  if (nodeMap[id]) nodeMap[id].el.classList.add('sel');
  panel(id);
  renderMinimap();
}

function centerCamera() {
  const vpRect = view.getBoundingClientRect();
  const vpw = vpRect.width || (window.innerWidth - 264);
  const vph = vpRect.height || (window.innerHeight - 100);
  scale = 0.65;
  tx = vpw / 2 - C.x * scale;
  ty = vph / 2 - C.y * scale;
  requestSceneRender();
}

function reset(recenter = false) {
  flushCurrentNotes();
  selectedNodes.clear();
  document.getElementById('search').value = '';
  Object.values(nodeMap).forEach(n => n.el.classList.remove('sel', 'dim'));
  if (recenter) centerCamera();
  panel(C.id);
  renderMinimap();
}

document.getElementById('reset').onclick = () => reset(true);

document.getElementById('search').oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { 
    Object.values(nodeMap).forEach(o => o.el.classList.remove('dim'));
    return; 
  }
  Object.entries(nodeMap).forEach(([id, o]) => {
    o.el.classList.toggle('dim', !o.name.toLowerCase().includes(q));
    o.el.classList.remove('sel');
  });
};

// ==========================================================================
// BLOCK K: VIEWPORT-NAVIGATION & INTERAKTIVE MINIMAP
// ==========================================================================
let scale = 0.65;
let tx = (window.innerWidth - 264) / 2 - C.x * scale;
let ty = (window.innerHeight - 100) / 2 - C.y * scale;
let drag = false, sx, sy, ox, oy;
let isSelecting = false, boxStartX = 0, boxStartY = 0;

const view = document.getElementById('viewport'), scene = document.getElementById('scene');
const selBox = document.getElementById('selectionBox');
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');
const mmViewport = document.getElementById('minimapViewport');
const mmContainer = document.getElementById('minimapContainer');

let renderPending = false;
function requestSceneRender() {
  if (!renderPending) {
    renderPending = true;
    requestAnimationFrame(() => {
      scene.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${scale})`;
      document.getElementById('zoom').textContent = Math.round(scale * 100) + '%';
      renderMinimap();
      renderPending = false;
    });
  }
}
requestSceneRender();

// Minimap Rendering
function renderMinimap() {
  const mw = mmCanvas.width;
  const mh = mmCanvas.height;
  mmCtx.clearRect(0, 0, mw, mh);

  const allNodes = Object.values(nodeMap);
  for (let i = 0; i < allNodes.length; i++) {
    const n = allNodes[i];
    const mx = (n.x / CANVAS_W) * mw;
    const my = (n.y / CANVAS_H) * mh;

    mmCtx.beginPath();
    if (n.kind === 'center') {
      mmCtx.fillStyle = '#ff168a';
      mmCtx.arc(mx, my, 3.5, 0, Math.PI * 2);
    } else if (n.kind === 'group') {
      mmCtx.fillStyle = '#f0de00';
      mmCtx.arc(mx, my, 2.5, 0, Math.PI * 2);
    } else {
      mmCtx.fillStyle = '#6aa7ed';
      mmCtx.arc(mx, my, 1.8, 0, Math.PI * 2);
    }
    mmCtx.fill();
  }

  const vpRect = view.getBoundingClientRect();
  const vpw = vpRect.width || (window.innerWidth - 264);
  const vph = vpRect.height || (window.innerHeight - 100);

  const sceneLeft = -tx / scale;
  const sceneTop = -ty / scale;
  const sceneWidth = vpw / scale;
  const sceneHeight = vph / scale;

  const mmLeft = Math.max(0, (sceneLeft / CANVAS_W) * mw);
  const mmTop = Math.max(0, (sceneTop / CANVAS_H) * mh);
  const mmWidth = Math.min(mw - mmLeft, (sceneWidth / CANVAS_W) * mw);
  const mmHeight = Math.min(mh - mmTop, (sceneHeight / CANVAS_H) * mh);

  mmViewport.style.left = mmLeft + 'px';
  mmViewport.style.top = mmTop + 'px';
  mmViewport.style.width = mmWidth + 'px';
  mmViewport.style.height = mmHeight + 'px';
}

// FIX: Minimap Clamping gegen Out-of-Bounds
let mmDragging = false;
function navigateFromMinimap(e) {
  const rect = mmContainer.getBoundingClientRect();
  const clickX = Math.max(0, Math.min(mmCanvas.width, e.clientX - rect.left));
  const clickY = Math.max(0, Math.min(mmCanvas.height, e.clientY - rect.top));

  const targetCanvasX = (clickX / mmCanvas.width) * CANVAS_W;
  const targetCanvasY = (clickY / mmCanvas.height) * CANVAS_H;

  const vpRect = view.getBoundingClientRect();
  const vpw = vpRect.width || (window.innerWidth - 264);
  const vph = vpRect.height || (window.innerHeight - 100);

  tx = vpw / 2 - targetCanvasX * scale;
  ty = vph / 2 - targetCanvasY * scale;
  requestSceneRender();
}

mmContainer.onmousedown = (e) => {
  e.stopPropagation();
  mmDragging = true;
  navigateFromMinimap(e);
};
window.addEventListener('mousemove', (e) => {
  if (mmDragging) navigateFromMinimap(e);
});
window.addEventListener('mouseup', () => {
  mmDragging = false;
});

// Viewport Mouse Controls
view.onmousedown = e => {
  if (e.button !== 0 || e.target.closest('.node') || e.target.closest('.minimap-container')) return;
  const rect = view.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  if (e.shiftKey) {
    isSelecting = true;
    boxStartX = mouseX;
    boxStartY = mouseY;
    selBox.style.left = boxStartX + 'px';
    selBox.style.top = boxStartY + 'px';
    selBox.style.width = '0px';
    selBox.style.height = '0px';
    selBox.style.display = 'block';
    view.classList.add('selecting');
    selectedNodes.clear();
    Object.values(nodeMap).forEach(n => n.el.classList.remove('sel', 'dim'));
  } else {
    drag = true; 
    sx = e.clientX; 
    sy = e.clientY; 
    ox = tx; 
    oy = ty; 
    view.classList.add('drag');
  }
};

window.addEventListener('mousemove', e => {
  if (isSelecting) {
    const rect = view.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const left = Math.min(boxStartX, mouseX);
    const top = Math.min(boxStartY, mouseY);
    const width = Math.abs(mouseX - boxStartX);
    const height = Math.abs(mouseY - boxStartY);

    selBox.style.left = left + 'px';
    selBox.style.top = top + 'px';
    selBox.style.width = width + 'px';
    selBox.style.height = height + 'px';

    const sceneLeft = (left - tx) / scale;
    const sceneTop = (top - ty) / scale;
    const sceneRight = (left + width - tx) / scale;
    const sceneBottom = (top + height - ty) / scale;

    selectedNodes.clear();
    const allNodes = Object.values(nodeMap);
    for (let i = 0; i < allNodes.length; i++) {
      const nObj = allNodes[i];
      nObj.el.classList.remove('dim');
      const nLeft = nObj.x - nObj.w / 2;
      const nRight = nObj.x + nObj.w / 2;
      const nTop = nObj.y - nObj.h / 2;
      const nBottom = nObj.y + nObj.h / 2;

      const inBox = (nLeft < sceneRight && nRight > sceneLeft && nTop < sceneBottom && nBottom > sceneTop);
      if (inBox) {
        selectedNodes.add(nObj.id);
        nObj.el.classList.add('sel');
      } else {
        nObj.el.classList.remove('sel');
      }
    }
  } else if (drag) {
    tx = ox + e.clientX - sx;
    ty = oy + e.clientY - sy;
    requestSceneRender();
  }
}, { passive: true });

window.addEventListener('mouseup', e => {
  if (isSelecting) {
    isSelecting = false;
    selBox.style.display = 'none';
    view.classList.remove('selecting');
    if (selectedNodes.size > 1) {
      renderMultiSelectPanel();
    } else if (selectedNodes.size === 1) {
      focus(Array.from(selectedNodes)[0]);
    } else {
      reset(false);
    }
  }
  if (drag) {
    let movedDist = Math.hypot(e.clientX - sx, e.clientY - sy);
    drag = false;
    view.classList.remove('drag');
    if (movedDist < 4) {
      reset(false);
    }
  }
});

view.onwheel = e => {
  e.preventDefault();
  const r = view.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, old = scale;
  scale = Math.max(0.25, Math.min(1.6, scale * (e.deltaY < 0 ? 1.09 : 0.92)));
  tx = mx - (mx - tx) * scale / old;
  ty = my - (my - ty) * scale / old;
  requestSceneRender();
};

// ==========================================================================
// BLOCK L: TASTATUR-SHORTCUTS
// ==========================================================================
buildGraph();
panel();

window.addEventListener('keydown', (e) => {
  if (e.key === 'Control') scene.classList.add('grid-active');
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

  // Strg + C (Kopieren)
  if (e.ctrlKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    copySelectedNodes();
  }

  // Strg + V (Einfügen)
  if (e.ctrlKey && e.key.toLowerCase() === 'v') {
    e.preventDefault();
    pasteNodes();
  }

  // Taste E: Zentrieren
  if (e.key.toLowerCase() === 'e') reset(true);

  // Löschen
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedNodes.size > 1) {
      deleteMultipleNodes(Array.from(selectedNodes));
    } else if (selectedNodes.size === 1) {
      const singleId = Array.from(selectedNodes)[0];
      if (singleId !== C.id) {
        const name = nodeMap[singleId] ? nodeMap[singleId].name : singleId;
        if (confirm(`Möchtest du '${name}' und alle dazugehörigen Unterbegriffe wirklich löschen?`)) {
          deleteNodeFromData(singleId);
        }
      }
    }
  }
});

window.addEventListener('keyup', (e) => {
  if (e.key === 'Control') scene.classList.remove('grid-active');
});
</script>
